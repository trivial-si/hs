name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify version, checks, and source package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$RELEASE_TAG" = "v$version"
          python3 scripts/check-doc-links.py
          python3 scripts/extract-release-notes.py "$RELEASE_TAG" > /dev/null
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
          cargo test --locked
          cargo package --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: ""
            run_tests: "true"
            run_demo: "true"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: ""
            run_tests: "true"
            run_demo: "true"
          - name: macos-aarch64
            os: macos-latest
            target: ""
            run_tests: "true"
            run_demo: "true"
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            run_tests: "false"
            run_demo: "false"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"
      - name: Run test suite
        if: matrix.run_tests == 'true'
        run: cargo test --locked
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ -n "$TARGET" ]; then
            cargo build --release --locked --target "$TARGET"
            file "target/$TARGET/release/hs"
          else
            cargo build --release --locked
            file target/release/hs
          fi
      - name: Smoke-test terminal demo
        if: matrix.run_demo == 'true'
        run: HS=./target/release/hs docs/demo.sh --no-tui
      - name: Package archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          bundle="hs-${RELEASE_TAG}-${ASSET_NAME}"
          bin_path="target/release/hs"
          if [ -n "$TARGET" ]; then
            bin_path="target/$TARGET/release/hs"
          fi
          mkdir -p "dist/$bundle"
          cp "$bin_path" LICENSE NOTICE "dist/$bundle/"
          cp -r completions "dist/$bundle/"
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-draft:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Assemble checksums and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/extract-release-notes.py "$RELEASE_TAG" > dist/release-notes.md
          cd dist
          LC_ALL=C sha256sum hs-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/hs-*.tar.gz dist/SHA256SUMS --verify-tag --draft --title "hs $RELEASE_TAG" --notes-file dist/release-notes.md
