name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Verify version and checks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$RELEASE_TAG" = "v$version"
          python3 scripts/check-doc-links.py
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cargo package --locked
      - name: Package binary and notices
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle="hs-${RELEASE_TAG}-linux-x86_64"
          mkdir -p "dist/$bundle"
          cp target/release/hs LICENSE NOTICE "dist/$bundle/"
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
          cd dist
          sha256sum "$bundle.tar.gz" > SHA256SUMS
      - name: Create draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --title "hs $RELEASE_TAG" --notes-file .github/release-notes.md
